gradle.beforeProject { project ->
    project.pluginManager.withPlugin('java') {
        project.tasks.register('wayfarerDebugRuntime') {
            dependsOn(project.tasks.named('classes'), project.sourceSets.main.runtimeClasspath)
            doLast {
                project.sourceSets.main.runtimeClasspath.files.each { entry ->
                    println("WAYFARER_RUNTIME=" + entry.absolutePath)
                }
            }
        }
    }
}

